<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Izin Keluar - SNA Medika</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root { 
    --primary: #dc2626; 
    --primary-hover: #b91c1c;
    --primary-light: #fef2f2;
    --success: #16a34a; 
    --success-light: #f0fdf4;
    --bg: #ffffff; 
    --bg-light: #fef2f2;
    --card: #ffffff; 
    --text: #0f172a; 
    --muted: #64748b;
    --border: #fecaca;
    --border-light: #fca5a5;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  
  body { 
    background: var(--bg-light); 
    color: var(--text); 
    min-height: 100vh;
    overflow-x: hidden;
  }

  .mobile-view { display: none; min-height: 100vh; padding: 20px; position: relative; }
  .mobile-container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }
  .mobile-header { text-align: center; margin-bottom: 25px; padding-top: 15px; }
  .mobile-logo { width: 70px; height: 70px; background: linear-gradient(135deg, var(--primary), #991b1b); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: white; margin: 0 auto 12px; box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3); }
  .mobile-header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: var(--primary); }
  .mobile-header p { color: var(--muted); font-size: 13px; }

  .mode-switcher { display: flex; gap: 8px; margin-bottom: 18px; background: white; padding: 5px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(220, 38, 38, 0.05); }
  .mode-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }

  .scan-card, .input-card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05); }
  #qr-reader { width: 100%; border-radius: 12px; overflow: hidden; background: #f1f5f9; min-height: 280px; border: 2px dashed var(--border); }
  .scanner-controls { display: flex; gap: 10px; margin-top: 12px; }

  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-field { width: 100%; padding: 13px; background: var(--bg-light); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: 0.3s; }
  .input-field:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }
  .input-field::placeholder { color: #cbd5e1; font-weight: 500; }

  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
  .btn-primary { background: var(--primary); box-shadow: 0 6px 18px rgba(220, 38, 38, 0.25); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
  .btn-secondary { background: white; color: var(--primary); border: 1.5px solid var(--border); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  
  /* ✅ PERBAIKAN: Icon refresh putih dan terlihat jelas saat loading */
  .btn-primary .fa-arrows-rotate,
  .btn-primary .fa-spinner {
    color: #ffffff !important;
  }
  
  .btn-primary:disabled .fa-spinner {
    color: #ffffff !important;
    animation: fa-spin 1s infinite linear;
  }
  
  @keyframes fa-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .info-box { background: var(--primary-light); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 12px; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 8px; }

  .desktop-view { display: none; min-height: 100vh; background: var(--bg-light); padding: 30px; }
  .desktop-container { max-width: 1400px; margin: 0 auto; }
  .desktop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; background: white; padding: 20px 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05); }
  .desktop-header h1 { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 12px; color: var(--primary); }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid var(--border); transition: 0.3s; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05); }
  .stat-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(220, 38, 38, 0.1); }
  .stat-number { font-size: 36px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .dashboard-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05); }
  .card-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; color: var(--text); }
  .card-title i { color: var(--primary); margin-right: 8px; }
  .filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .filter-row .input-group { margin-bottom: 0; flex: 1; min-width: 150px; }
  .btn-sm { padding: 10px 18px; font-size: 13px; width: auto; }
  .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: var(--primary); color: white; font-weight: 700; padding: 14px; text-align: left; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  td { padding: 14px; border-bottom: 1px solid var(--border); color: var(--text); font-weight: 500; }
  tr:nth-child(even) { background-color: var(--primary-light); }
  tr:hover td { background-color: #fee2e2; }
  .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block; text-transform: uppercase; }
  .badge-keluar { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .badge-masuk { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.3; color: var(--primary); }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: white; border: 1px solid var(--border); color: var(--text); padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 9999; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 90%; max-width: 380px; text-align: center; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--primary); color: var(--primary); }

  #successOverlay { 
    display: none; 
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    background: rgba(15, 23, 42, 0.9); 
    backdrop-filter: blur(8px); 
    z-index: 99999; 
    justify-content: center; 
    align-items: center; 
    flex-direction: column; 
    color: white; 
    animation: fadeIn 0.3s ease; 
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
  }
  .success-icon {
    font-size: 100px;
    margin-bottom: 20px;
    animation: bounceIn 0.5s;
  }
  .success-icon.keluar { color: #dc2626; }
  .success-icon.masuk { color: #16a34a; }
  .success-message {
    font-size: 28px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 8px;
  }
  .success-submessage {
    font-size: 16px;
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 8px;
  }
  .success-time {
    font-size: 14px;
    color: #94a3b8;
    font-family: monospace;
  }

  @media (max-width: 768px) { .mobile-view { display: block !important; } .desktop-view { display: none !important; } }
  @media (min-width: 769px) { .mobile-view { display: none !important; } .desktop-view { display: block !important; } }
  @media (max-width: 1024px) and (min-width: 769px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } .scanner-controls { flex-direction: column; } }
</style>
</head>
<body>

<!-- ==================== MOBILE VIEW ==================== -->
<div class="mobile-view">
  <div class="mobile-container">
    <div class="mobile-header">
      <div class="mobile-logo">SNA</div>
      <h1>Izin Keluar Area</h1>
      <p>Scan QR Code - Auto Keluar/Masuk</p>
    </div>

    <div class="mode-switcher">
      <button class="mode-btn active" onclick="switchMode('qr')"><i class="fa-solid fa-qrcode"></i> Scan QR</button>
      <button class="mode-btn" onclick="switchMode('manual')"><i class="fa-solid fa-keyboard"></i> Input NIK</button>
    </div>

    <!-- QR Scanner -->
    <div id="qrMode" class="scan-card">
      <div class="info-box">
        <i class="fa-solid fa-bolt"></i>
        <span><strong>Auto Mode:</strong> Scan QR → Validasi API → Otomatis Keluar/Masuk</span>
      </div>
      <div id="qr-reader"></div>
      <div class="scanner-controls">
        <button class="btn btn-primary" id="btnStartScan" onclick="toggleScanner()">
          <i class="fa-solid fa-camera"></i> Mulai Scan
        </button>
        <button class="btn btn-secondary" id="btnSwitchCam" onclick="switchCamera()" style="display:none;">
          <i class="fa-solid fa-rotate"></i> Ganti Kamera
        </button>
      </div>
    </div>

    <!-- Manual Input -->
    <div id="manualMode" class="input-card" style="display: none;">
      <div class="input-group">
        <label>NIK Karyawan</label>
        <input type="text" id="nikInput" class="input-field" placeholder="Contoh: 3.26.09.150452" autocomplete="off" onkeypress="if(event.key==='Enter') autoRecordManual()">
      </div>
      <button class="btn btn-primary" id="btnManualSubmit" onclick="autoRecordManual()">
        <i class="fa-solid fa-paper-plane"></i> Kirim
      </button>
    </div>
  </div>
</div>

<!-- ==================== DESKTOP VIEW ==================== -->
<div class="desktop-view">
  <div class="desktop-container">
    <div class="desktop-header">
      <h1><i class="fa-solid fa-door-open"></i> Monitoring Izin Keluar</h1>
      <button class="btn btn-sm btn-primary" onclick="openPdfModal()"><i class="fa-solid fa-file-pdf"></i> Download Laporan PDF</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="statKeluar">0</div>
        <div class="stat-label">Sedang di Luar</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statMasuk">0</div>
        <div class="stat-label">Sudah Kembali</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Total Transaksi Hari Ini</div>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-title">
        <span><i class="fa-solid fa-list"></i> Log Harian</span>
        <div class="filter-row">
          <div class="input-group">
            <label>Pilih Tanggal</label>
            <input type="date" id="filterDate" class="input-field" style="color-scheme: light;">
          </div>
          <button class="btn btn-sm btn-primary" onclick="loadDashboard()" id="btnRefresh">
            <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i> <span id="refreshText">Refresh</span>
          </button>
          <button class="btn btn-sm btn-secondary" onclick="loadAllData()"><i class="fa-solid fa-list"></i> Lihat Semua</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>NIK</th>
              <th>Nama</th>
              <th>Divisi</th>
              <th>Jenis</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <tr><td colspan="5" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat data...</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="successOverlay">
  <i id="successIcon" class="fa-solid fa-circle-check success-icon"></i>
  <h2 id="successMessage" class="success-message">BERHASIL!</h2>
  <p id="successSubMessage" class="success-submessage">-</p>
  <p id="successTime" class="success-time">-</p>
</div>

<script>
  // ==========================================
  // KONFIGURASI API (URL BARU)
  // ==========================================
  const API_KARYAWAN_URL = "https://www.snam110.dpdns.org/absen/api/karyawan";
  const API_LOG_URL = "https://script.google.com/macros/s/AKfycbwoGflkGn7GFgKgPAWJRuk52xXV3-wYDVN6elkkL_J5FZjr3xgM72nzTSN2TAe1P7Jh/exec";

  let dbKaryawan = [];
  let html5QrCode = null;
  let isScanning = false;
  let currentFacingMode = "environment";
  let lastDecodedText = null;
  let isProcessing = false;
  let dashboardRefreshInterval = null;
  let isDashboardLoading = false;

  function showToast(msg, type = 'error') {
    const t = document.getElementById('toast');
    const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
    t.innerHTML = `<i class="fa-solid ${icons[type] || 'fa-circle-info'}"></i> ${msg}`;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function showSuccessOverlay(jenis, nama, waktu) {
    const overlay = document.getElementById('successOverlay');
    const icon = document.getElementById('successIcon');
    const message = document.getElementById('successMessage');
    const subMessage = document.getElementById('successSubMessage');
    const time = document.getElementById('successTime');
    
    if (jenis === 'KELUAR') {
      icon.className = 'fa-solid fa-arrow-right-from-bracket success-icon keluar';
      message.textContent = '✅ BERHASIL KELUAR';
    } else {
      icon.className = 'fa-solid fa-arrow-right-to-bracket success-icon masuk';
      message.textContent = '✅ BERHASIL MASUK';
    }
    
    subMessage.textContent = nama;
    time.textContent = `Waktu: ${waktu} WIB`;
    
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.display = 'none'; }, 2000);
  }

  function switchMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    event.target.closest('.mode-btn').classList.add('active');
    
    if (mode === 'qr') {
      document.getElementById('qrMode').style.display = 'block';
      document.getElementById('manualMode').style.display = 'none';
    } else {
      document.getElementById('qrMode').style.display = 'none';
      document.getElementById('manualMode').style.display = 'block';
      stopScanner();
    }
  }

  async function toggleScanner() {
    if (isScanning) stopScanner();
    else await startScanner();
  }

  async function startScanner() {
    const btn = document.getElementById('btnStartScan');
    const switchBtn = document.getElementById('btnSwitchCam');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Meminta izin...';
    btn.disabled = true;

    if (html5QrCode) {
      try { await html5QrCode.clear(); } catch(e) {}
      html5QrCode = null;
    }

    html5QrCode = new Html5Qrcode("qr-reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 }, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] };

    try {
      await html5QrCode.start({ facingMode: currentFacingMode }, config, onScanSuccess, () => {});
      isScanning = true;
      btn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Scan';
      btn.disabled = false;
      switchBtn.style.display = 'flex';
    } catch (err) {
      showToast("❌ Gagal akses kamera. Pastikan izin diberikan.", "error");
      btn.innerHTML = '<i class="fa-solid fa-camera"></i> Mulai Scan';
      btn.disabled = false;
      switchBtn.style.display = 'none';
    }
  }

  function stopScanner() {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        isScanning = false;
        document.getElementById('btnStartScan').innerHTML = '<i class="fa-solid fa-camera"></i> Mulai Scan';
        document.getElementById('btnStartScan').disabled = false;
        document.getElementById('btnSwitchCam').style.display = 'none';
      }).catch(err => console.error(err));
    }
  }

  async function switchCamera() {
    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    if (isScanning) {
      await stopScanner();
      setTimeout(() => startScanner(), 500);
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    lastDecodedText = null;
    stopScanner();
    autoRecord(decodedText);
  }

  async function autoRecord(nik) {
    if (isProcessing) return;
    isProcessing = true;
    
    const inputNIK = String(nik).trim().toUpperCase();
    if (!inputNIK) {
      showToast("❌ NIK tidak valid", "error");
      isProcessing = false;
      return;
    }
    
    const karyawan = dbKaryawan.find(k => String(k.nik).trim().toUpperCase() === inputNIK);
    
    if (!karyawan) {
      showToast("❌ NIK tidak ditemukan di database karyawan", "error");
      isProcessing = false;
      setTimeout(() => { if (document.getElementById('qrMode').style.display !== 'none') startScanner(); }, 2000);
      return;
    }

    const localLogs = JSON.parse(localStorage.getItem('logIzin') || '[]');
    const lastLog = localLogs.filter(l => l.nik === inputNIK).pop();
    const jenis = (!lastLog || lastLog.jenis === 'MASUK') ? 'KELUAR' : 'MASUK';
    const waktu = new Date().toLocaleString('id-ID', { hour12: false }).replace(',', '');

    const logData = {
      nik: karyawan.nik,
      nama: karyawan.nama,
      divisi: karyawan.divisi,
      jenis: jenis,
      waktu: waktu,
      tanggal: new Date().toISOString().split('T')[0]
    };

    try {
      const response = await fetch(`${API_LOG_URL}?action=autoRecord&nik=${encodeURIComponent(logData.nik)}&nama=${encodeURIComponent(logData.nama)}&divisi=${encodeURIComponent(logData.divisi)}&jenis=${jenis}&waktu=${encodeURIComponent(waktu)}&t=${Date.now()}`);
      const result = await response.json();
      
      if (result.status === "success") {
        showSuccessOverlay(jenis, karyawan.nama, waktu);
      } else {
        throw new Error(result.message || "Gagal simpan ke server");
      }
    } catch (error) {
      console.warn("Gagal simpan ke API_LOG_URL, menggunakan fallback localStorage:", error);
      localLogs.push(logData);
      localStorage.setItem('logIzin', JSON.stringify(localLogs));
      showSuccessOverlay(jenis, karyawan.nama, waktu);
      showToast("⚠️ Disimpan lokal (Server tidak merespons)", "info");
    }

    lastDecodedText = null;
    setTimeout(() => {
      isProcessing = false;
      if (document.getElementById('qrMode').style.display !== 'none') {
        startScanner();
      }
      if (window.innerWidth >= 769) loadDashboard();
    }, 2500);
  }

  async function autoRecordManual() {
    const nikInput = document.getElementById('nikInput');
    const nik = nikInput.value.trim();
    
    if (!nik) {
      showToast("❌ Masukkan NIK terlebih dahulu", "error");
      nikInput.focus();
      return;
    }
    
    if (isProcessing) {
      showToast("⏳ Sedang memproses, tunggu sebentar...", "info");
      return;
    }
    
    const btn = document.getElementById('btnManualSubmit');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
    btn.disabled = true;
    
    await autoRecord(nik);
    
    setTimeout(() => {
      nikInput.value = "";
      nikInput.focus();
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 2500);
  }

  async function loadKaryawanData() {
    try {
      showToast("Memuat data karyawan dari server...", "info");
      const response = await fetch(API_KARYAWAN_URL);
      const result = await response.json();
      
      if (result.status === true && Array.isArray(result.data)) {
        dbKaryawan = result.data;
        console.log(`✅ Berhasil memuat ${dbKaryawan.length} data karyawan dari API.`);
        showToast("✅ Data karyawan berhasil dimuat", "success");
      } else {
        throw new Error("Format data tidak sesuai");
      }
    } catch (error) {
      console.error("❌ Gagal memuat data karyawan:", error);
      showToast("❌ Gagal terhubung ke API Karyawan", "error");
    }
  }

  async function loadDashboard() {
    if (isDashboardLoading) return;
    isDashboardLoading = true;
    
    // ✅ Tampilkan loading state dengan icon putih
    const btnRefresh = document.getElementById('btnRefresh');
    const refreshIcon = document.getElementById('refreshIcon');
    const refreshText = document.getElementById('refreshText');
    
    if (btnRefresh) {
      btnRefresh.disabled = true;
      refreshIcon.className = 'fa-solid fa-spinner fa-spin';
      refreshText.textContent = 'Loading...';
    }
    
    const dateInput = document.getElementById('filterDate');
    if (!dateInput.value) dateInput.value = new Date().toISOString().split('T')[0];
    const targetDate = dateInput.value;
    
    const tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat data...</p></td></tr>';

    try {
      const response = await fetch(`${API_LOG_URL}?action=laporan&tanggal=${targetDate}&t=${Date.now()}`);
      const result = await response.json();

      if (result.status === "success" && result.data) {
        renderTable(result.data, targetDate);
      } else {
        throw new Error("Data dari server tidak lengkap");
      }
    } catch (error) {
      console.warn("Menggunakan data localStorage sebagai fallback:", error);
      const localLogs = JSON.parse(localStorage.getItem('logIzin') || '[]');
      const filteredLogs = localLogs.filter(log => log.tanggal === targetDate);
      renderTable(filteredLogs, targetDate);
    } finally {
      isDashboardLoading = false;
      // ✅ Kembalikan tombol ke state normal
      if (btnRefresh) {
        btnRefresh.disabled = false;
        refreshIcon.className = 'fa-solid fa-arrows-rotate';
        refreshText.textContent = 'Refresh';
      }
    }
  }

  function renderTable(data, targetDate) {
    const tbody = document.getElementById('logTableBody');
    let keluarCount = 0, masukCount = 0;
    
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fa-solid fa-inbox"></i><p>Tidak ada data untuk tanggal ini</p></td></tr>';
    } else {
      tbody.innerHTML = data.map(row => {
        if (row.jenis === 'KELUAR') keluarCount++; else masukCount++;
        return `<tr>
          <td style="font-family: monospace; font-weight: 600;">${row.waktu}</td>
          <td style="font-weight: 700;">${row.nik}</td>
          <td>${row.nama}</td>
          <td>${row.divisi}</td>
          <td><span class="badge ${row.jenis === 'KELUAR' ? 'badge-keluar' : 'badge-masuk'}">${row.jenis}</span></td>
        </tr>`;
      }).join('');
    }
    
    document.getElementById('statTotal').textContent = data ? data.length : 0;
    document.getElementById('statKeluar').textContent = keluarCount;
    document.getElementById('statMasuk').textContent = masukCount;
  }

  async function loadAllData() {
    if (isDashboardLoading) return;
    isDashboardLoading = true;
    
    const tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat semua data...</p></td></tr>';

    try {
      const response = await fetch(`${API_LOG_URL}?action=allData&t=${Date.now()}`);
      const result = await response.json();

      if (result.status === "success" && result.data) {
        renderTable(result.data, 'Semua');
        document.getElementById('statTotal').textContent = result.data.length;
      } else {
        throw new Error("Data tidak lengkap");
      }
    } catch (error) {
      const localLogs = JSON.parse(localStorage.getItem('logIzin') || '[]');
      renderTable(localLogs, 'Semua');
      document.getElementById('statTotal').textContent = localLogs.length;
    } finally {
      isDashboardLoading = false;
    }
  }

  function openPdfModal() {
    const dateInput = document.getElementById('filterDate').value || new Date().toISOString().split('T')[0];
    generatePdf(dateInput);
  }

  async function generatePdf(tanggal) {
    const btn = document.querySelector('.desktop-header .btn-primary');
    const originalText = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...'; btn.disabled = true; }

    try {
      let data = [];
      try {
        const response = await fetch(`${API_LOG_URL}?action=laporanDurasi&tanggal=${tanggal}&t=${Date.now()}`);
        const result = await response.json();
        if (result.status === "success") data = result.data;
      } catch(e) {
        data = JSON.parse(localStorage.getItem('logIzin') || '[]').filter(l => l.tanggal === tanggal);
      }
      
      if (!data || data.length === 0) {
        showToast("❌ Tidak ada data untuk tanggal ini", "error"); return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('portrait', 'mm', 'a4');
      const pageWidth = doc.internal.pageSize.getWidth();
      
      doc.setFillColor(220, 38, 38);
      doc.rect(0, 0, pageWidth, 40, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(18);
      doc.setFont('helvetica', 'bold');
      doc.text('LAPORAN IZIN KELUAR HARIAN', pageWidth / 2, 15, { align: 'center' });
      doc.setFontSize(12);
      doc.setFont('helvetica', 'normal');
      doc.text(`Tanggal: ${tanggal}`, pageWidth / 2, 24, { align: 'center' });
      
      doc.autoTable({
        startY: 48,
        head: [['Waktu', 'NIK', 'Nama', 'Divisi', 'Jenis']],
        body: data.map(row => [row.waktu, row.nik, row.nama, row.divisi, row.jenis]),
        theme: 'grid',
        headStyles: { fillColor: [220, 38, 38], textColor: 255, fontStyle: 'bold', fontSize: 9, halign: 'center' },
        bodyStyles: { fontSize: 9, cellPadding: 3, valign: 'middle' },
        alternateRowStyles: { fillColor: [254, 242, 242] }
      });
      
      doc.save(`Laporan_Izin_${tanggal}.pdf`);
      showToast("✅ PDF berhasil diunduh", "success");
    } catch (err) {
      console.error("PDF error:", err);
      showToast("❌ Gagal membuat PDF", "error");
    } finally {
      if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
    }
  }

  window.addEventListener('load', function() {
    const today = new Date().toISOString().split('T')[0];
    const filterDate = document.getElementById('filterDate');
    if (filterDate) filterDate.value = today;
    
    loadKaryawanData();
    
    if (window.innerWidth >= 769) {
      loadDashboard();
      if (dashboardRefreshInterval) clearInterval(dashboardRefreshInterval);
      dashboardRefreshInterval = setInterval(() => { loadDashboard(); }, 60000);
    }
  });

  window.addEventListener('resize', function() {
    if (window.innerWidth >= 769) {
      if (!dashboardRefreshInterval) {
        loadDashboard();
        dashboardRefreshInterval = setInterval(loadDashboard, 60000);
      }
    } else {
      if (dashboardRefreshInterval) {
        clearInterval(dashboardRefreshInterval);
        dashboardRefreshInterval = null;
      }
      stopScanner();
    }
  });
</script>
</body>
